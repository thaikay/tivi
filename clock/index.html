<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThaiTV - Digital Clock (Múi Giờ)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>⏰ ThaiTV Digital Clock</h1>
            <button id="themeToggle" class="theme-toggle" title="Chế độ tối/sáng">
                <span class="icon">🌙</span>
            </button>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Clocks Container -->
            <div class="clocks-container">
                <div class="clock-card" data-timezone="Asia/Ho_Chi_Minh">
                    <div class="clock-header">
                        <h2>🇻🇳 Việt Nam</h2>
                        <button class="remove-btn" title="Xóa múi giờ này">✕</button>
                    </div>
                    <div class="clock-display">
                        <div class="time">00:00:00</div>
                        <div class="timezone">Asia/Ho_Chi_Minh (UTC+7)</div>
                    </div>
                </div>

                <div class="clock-card" data-timezone="Asia/Bangkok">
                    <div class="clock-header">
                        <h2>🇹🇭 Thái Lan</h2>
                        <button class="remove-btn" title="Xóa múi giờ này">✕</button>
                    </div>
                    <div class="clock-display">
                        <div class="time">00:00:00</div>
                        <div class="timezone">Asia/Bangkok (UTC+7)</div>
                    </div>
                </div>

                <div class="clock-card" data-timezone="Asia/Tokyo">
                    <div class="clock-header">
                        <h2>🇯🇵 Nhật Bản</h2>
                        <button class="remove-btn" title="Xóa múi giờ này">✕</button>
                    </div>
                    <div class="clock-display">
                        <div class="time">00:00:00</div>
                        <div class="timezone">Asia/Tokyo (UTC+9)</div>
                    </div>
                </div>

                <div class="clock-card" data-timezone="America/New_York">
                    <div class="clock-header">
                        <h2>🇺🇸 Mỹ (New York)</h2>
                        <button class="remove-btn" title="Xóa múi giờ này">✕</button>
                    </div>
                    <div class="clock-display">
                        <div class="time">00:00:00</div>
                        <div class="timezone">America/New_York (UTC-5/-4)</div>
                    </div>
                </div>
            </div>

            <!-- Add Timezone Section -->
            <div class="add-timezone-section">
                <h3>Thêm Múi Giờ</h3>
                <div class="add-timezone-form">
                    <select id="timezoneSelect" class="timezone-select">
                        <option value="">-- Chọn múi giờ --</option>
                        <optgroup label="Á Châu">
                            <option value="Asia/Ho_Chi_Minh">🇻🇳 Việt Nam (Asia/Ho_Chi_Minh)</option>
                            <option value="Asia/Bangkok">🇹🇭 Thái Lan (Asia/Bangkok)</option>
                            <option value="Asia/Tokyo">🇯🇵 Nhật Bản (Asia/Tokyo)</option>
                            <option value="Asia/Shanghai">🇨🇳 Trung Quốc (Asia/Shanghai)</option>
                            <option value="Asia/Hong_Kong">🇭🇰 Hồng Kông (Asia/Hong_Kong)</option>
                            <option value="Asia/Singapore">🇸🇬 Singapore (Asia/Singapore)</option>
                            <option value="Asia/Seoul">🇰🇷 Hàn Quốc (Asia/Seoul)</option>
                            <option value="Asia/Kolkata">🇮🇳 Ấn Độ (Asia/Kolkata)</option>
                            <option value="Asia/Dubai">🇦🇪 Các Tiểu Vương Quốc (Asia/Dubai)</option>
                        </optgroup>
                        <optgroup label="Âu Châu">
                            <option value="Europe/London">🇬🇧 Anh (Europe/London)</option>
                            <option value="Europe/Paris">🇫🇷 Pháp (Europe/Paris)</option>
                            <option value="Europe/Berlin">🇩🇪 Đức (Europe/Berlin)</option>
                            <option value="Europe/Moscow">🇷🇺 Nga (Europe/Moscow)</option>
                        </optgroup>
                        <optgroup label="Mỹ">
                            <option value="America/New_York">🇺🇸 Mỹ - New York (America/New_York)</option>
                            <option value="America/Chicago">🇺🇸 Mỹ - Chicago (America/Chicago)</option>
                            <option value="America/Denver">🇺🇸 Mỹ - Denver (America/Denver)</option>
                            <option value="America/Los_Angeles">🇺🇸 Mỹ - Los Angeles (America/Los_Angeles)</option>
                            <option value="America/Anchorage">🇺🇸 Mỹ - Anchorage (America/Anchorage)</option>
                        </optgroup>
                        <optgroup label="Khác">
                            <option value="Australia/Sydney">🇦🇺 Úc (Australia/Sydney)</option>
                            <option value="Pacific/Auckland">🇳🇿 New Zealand (Pacific/Auckland)</option>
                            <option value="UTC">⏰ UTC (Giờ Quốc tế)</option>
                        </optgroup>
                    </select>
                    <button id="addBtn" class="add-btn">➕ Thêm</button>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 ThaiTV - Digital Clock | Được phát triển bởi <a href="https://github.com/thaikay" target="_blank">ThaiKay</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
